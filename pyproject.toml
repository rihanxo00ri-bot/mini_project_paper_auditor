[project]
name = "paper_auditor"
version = "0.1.0"
description = "paper-auditor using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.21,<2.0.0",
    "gnani-vachana>=0.9.0",
    "google-genai>=1.65.0",
    "legacy-cgi>=2.6.4",
    "litellm>=1.102.0",
    "pymupdf>=1.26.7",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "4e6e2970-2140-47f7-9598-820eb31a1ebc"
